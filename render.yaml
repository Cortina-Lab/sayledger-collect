# Render Blueprint for the SayLedger Collect backend (PayPal SANDBOX only).
# Render dashboard -> New -> Blueprint -> pick this repo. Fill the secret env vars in the dashboard;
# they are never stored in this file.
services:
  - type: web
    name: sayledger-collect
    runtime: python
    rootDir: backend
    plan: starter            # a persistent disk needs a paid plan; free plan works but forgets books on restart
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.13"
      - key: PAYPAL_ENV
        value: sandbox
      - key: SAYLEDGER_DATA
        value: /var/data
      - key: META_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
    disk:
      name: books
      mountPath: /var/data
      sizeGB: 1
